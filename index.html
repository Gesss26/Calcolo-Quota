<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calcolatore Quote">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Calcolatore Quote</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <style>
        :root {
            --bg-color: #0a192f;
            --card-bg: #112240;
            --accent-gold: #FFD700;
            --text-gold: #f0c674;
            --border-gold: #b8860b;
            --input-bg: #233554;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* centratura verticale */
            min-height: 100vh;
            min-height: 100dvh; /* mobile moderno */
            padding: 15px;
            padding-top: env(safe-area-inset-top, 15px);
            padding-bottom: env(safe-area-inset-bottom, 15px);
            overflow-x: hidden;
        }

        /* Wrapper per centrare il contenuto */
        .app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        /* Intestazione Importo */
        .header-container {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }

        .header-label {
            background-color: var(--accent-gold);
            color: var(--bg-color);
            padding: 12px 15px;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
        }

        .header-input {
            background-color: transparent;
            border: none;
            color: var(--accent-gold);
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            outline: none;
            text-align: right;
            min-width: 0;
        }

        /* Contenitore Tabella */
        .table-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 10px;
            align-items: center;
        }

        button.btn-quota {
            width: 100%;
            padding: 12px 5px;
            background-color: var(--card-bg);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }

        button.btn-quota:active {
            background-color: var(--accent-gold);
            color: var(--bg-color);
        }

        .quota-display {
            background-color: var(--input-bg);
            border: 1px solid var(--border-gold);
            color: var(--accent-gold);
            padding: 12px 5px;
            font-size: 16px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
        }

        .result-display {
            background-color: var(--input-bg);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 12px 5px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border-radius: 6px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .reset-btn {
            margin-top: 40px;
            background-color: transparent;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            padding: 12px;
            font-size: 14px;
            width: 100%;
            max-width: 400px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .reset-btn:active {
            background-color: #ff6b6b;
            color: white;
        }

        /* ORIENTAMENTO ORIZZONTALE: layout più compatto */
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                justify-content: center;
                padding: 10px;
            }

            .app-wrapper {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 15px;
                max-width: 100%;
            }

            .header-container {
                margin-bottom: 0;
                max-width: 220px;
                order: 1;
            }

            .header-label {
                padding: 10px 10px;
                font-size: 14px;
            }

            .header-input {
                padding: 10px 8px;
                font-size: 16px;
            }

            .table-container {
                max-width: 400px;
                order: 2;
                gap: 8px;
            }

            .row {
                gap: 8px;
            }

            button.btn-quota,
            .quota-display,
            .result-display {
                padding: 8px 4px;
                font-size: 13px;
            }

            .result-display {
                font-size: 15px;
            }

            .reset-btn {
                margin-top: 0;
                max-width: 220px;
                padding: 10px;
                order: 3;
                align-self: center;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <!-- Input Importo Totale -->
        <div class="header-container">
            <div class="header-label">Importo:</div>
            <input type="number" id="totalAmount" class="header-input" placeholder="0" value="100" inputmode="decimal">
            <div style="padding: 10px; color: var(--accent-gold); font-weight:bold;">€</div>
        </div>

        <!-- Tabella Calcoli -->
        <div class="table-container">

            <div class="row">
                <button class="btn-quota" onclick="chiediQuota(1)">Quota 1</button>
                <div id="displayQuota1" class="quota-display">-</div>
                <div id="risultato1" class="result-display">-</div>
            </div>

            <div class="row">
                <button class="btn-quota" onclick="chiediQuota('X')">Quota X</button>
                <div id="displayQuotaX" class="quota-display">-</div>
                <div id="risultatoX" class="result-display">-</div>
            </div>

            <div class="row">
                <button class="btn-quota" onclick="chiediQuota(2)">Quota 2</button>
                <div id="displayQuota2" class="quota-display">-</div>
                <div id="risultato2" class="result-display">-</div>
            </div>

        </div>

        <!-- Pulsante Reset -->
        <button class="reset-btn" onclick="resetCampi()">RESET / NUOVO CALCOLO</button>

    </div>

    <script>
        function chiediQuota(tipo) {
            const importoTotaleInput = document.getElementById('totalAmount').value;

            if (importoTotaleInput === "" || parseFloat(importoTotaleInput) <= 0) {
                alert("Inserisci prima un Importo valido in alto!");
                return;
            }
            const importoTotale = parseFloat(importoTotaleInput.replace(',', '.'));

            let quotaInput = prompt("Inserisci il valore per Quota " + tipo + ":");

            if (quotaInput === null || quotaInput.trim() === "") {
                return;
            }

            quotaInput = quotaInput.replace(',', '.');
            const quota = parseFloat(quotaInput);

            if (isNaN(quota) || quota <= 0) {
                alert("Per favore, inserisci un numero di quota valido (es. 1.85)");
                return;
            }

            const risultatoEsatto = importoTotale / quota;
            const risultatoArrotondato = Math.ceil(risultatoEsatto);

            let idDisplayQuota, idRisultato;

            if (tipo === 1) {
                idDisplayQuota = 'displayQuota1';
                idRisultato = 'risultato1';
            } else if (tipo === 'X') {
                idDisplayQuota = 'displayQuotaX';
                idRisultato = 'risultatoX';
            } else {
                idDisplayQuota = 'displayQuota2';
                idRisultato = 'risultato2';
            }

            document.getElementById(idDisplayQuota).innerText = quota.toFixed(2);
            document.getElementById(idRisultato).innerText = risultatoArrotondato;
        }

        function resetCampi() {
            document.getElementById('displayQuota1').innerText = '-';
            document.getElementById('displayQuotaX').innerText = '-';
            document.getElementById('displayQuota2').innerText = '-';

            document.getElementById('risultato1').innerText = '-';
            document.getElementById('risultatoX').innerText = '-';
            document.getElementById('risultato2').innerText = '-';
        }

        // Registrazione Service Worker per PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrato:', reg.scope))
                    .catch(err => console.log('Errore Service Worker:', err));
            });
        }
    </script>
</body>
</html>
